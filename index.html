<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
            color: #9ca3af;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website 🚀</h1>

    <p>I built this website myself!</p>

    <button>Click Me!</button>

</body>
</html>
